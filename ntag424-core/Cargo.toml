[package]
name = "ntag424-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["alloc"]
alloc = []
key_diversification = []

[dependencies]
aes = "0.9.0"
arrayvec = { version = "0.7", default-features = false }
cmac = "0.8.0"
p224 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
thiserror = { version = "2.0.18", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
