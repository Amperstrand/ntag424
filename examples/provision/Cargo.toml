[package]
name = "provision"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ntag424-provision"
path = "main.rs"

[dependencies]
anyhow = "1.0.102"
dialoguer = { version = "0.12.0", default-features = false }
ntag424 = { workspace = true, features = [
  "key_diversification",
  "sdm",
  "alloc",
] }
ntag424-pcsc.workspace = true
pcsc = "2.9"
rand = "0.10.1"
